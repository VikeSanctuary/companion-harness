name: Reference Companion Tests
on:
  push:
    paths:
      - "examples/reference-companion/**"
      - ".github/workflows/reference-companion.yml"
  pull_request:
    paths:
      - "examples/reference-companion/**"
      - ".github/workflows/reference-companion.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test core.test.mjs
        working-directory: examples/reference-companion
